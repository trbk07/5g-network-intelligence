[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "5g-network-intelligence"
version = "0.1.0"
description = "A reproducible 5G beam-level KPI forecasting and historical capacity-risk monitoring system using LightGBM, GRU, FastAPI, Streamlit, and Docker."
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "PyYAML>=6,<7", "huggingface-hub>=0.27,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
ml = ["lightgbm>=4.6,<5", "scikit-learn>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".venv", ".pytest_tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
