[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "5g-network-intelligence"
version = "1.0.0"
license = "MIT"
description = "A reproducible 5G beam-level KPI forecasting and historical capacity-risk monitoring system using LightGBM, GRU, FastAPI, Streamlit, and Docker."
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "PyYAML>=6,<7", "huggingface-hub>=0.27,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "ipython>=9,<10"]
ml = ["lightgbm>=4.6,<5", "scikit-learn>=1.6,<2"]
neural = ["torch>=2.6,<3"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.67,<2", "plotly>=6,<7", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = ["cloud_training: model fitting tests allowed only on hosted Colab/Kaggle"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".venv", ".pytest_tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
