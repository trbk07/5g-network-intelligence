services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: 5g-network-intelligence-api:week7
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ASSET_DIR: /app/demo_assets
    volumes:
      - ./demo_assets:/app/demo_assets:ro
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: 5g-network-intelligence-dashboard:week7
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
